; PlatformIO Configuration for EpicWeatherBox Firmware
; Custom firmware for SmallTV-Ultra hardware
; https://docs.platformio.org/page/projectconf.html
;
; Structure:
;   [env]              - Shared across ALL environments
;   [esp8266_common]   - Shared ESP8266 platform settings
;   [tft_smalltv]      - SmallTV-Ultra display (ST7789 240x240)
;   [env:esp8266]      - Main firmware build
;   [env:esp8266_debug] - Debug build
;   [env:recovery]     - Minimal recovery firmware

[platformio]
default_envs = esp8266

; =============================================================================
; SHARED — all environments
; =============================================================================
[env]
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

; =============================================================================
; ESP8266 COMMON — platform, board, flash config
; =============================================================================
[esp8266_common]
platform = espressif8266
board = esp12e
board_build.f_cpu = 160000000L
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.ldscript = eagle.flash.4m1m.ld
build_flags =
    -D ARDUINO_ESP8266_RELEASE="esp8266"
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -D BEARSSL_SSL_BASIC
    -Os

; =============================================================================
; TFT_eSPI — SmallTV-Ultra display (ST7789 240x240)
; =============================================================================
[tft_smalltv]
build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_RGB_ORDER=TFT_BGR
    ; Pin definitions (confirmed from hardware RE)
    -D TFT_CS=4
    -D TFT_DC=0
    -D TFT_RST=2
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    ; SPI Configuration
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    ; Fonts (enable what we need, disable rest to save flash)
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1

; =============================================================================
; MAIN FIRMWARE
; =============================================================================
[env:esp8266]
extends = esp8266_common
build_flags =
    ${esp8266_common.build_flags}
    ${tft_smalltv.build_flags}

lib_deps =
    tzapu/WiFiManager@^0.16.0
    bblanchon/ArduinoJson@^7.0.4
    bodmer/TFT_eSPI@^2.5.0
    arduino-libraries/NTPClient@^3.2.1
    squix78/JsonStreamingParser@^1.0.5
    bodmer/JPEGDecoder@^2.0.0

; Pre-build script to generate admin_html.h from data/admin.html
extra_scripts = pre:scripts/generate_admin_html.py

; Exclude recovery.cpp from main build (it has its own environment)
build_src_filter = +<*> -<recovery.cpp>

; Upload settings (uncomment and adjust for OTA)
; upload_protocol = espota
; upload_port = 192.168.1.xxx
; upload_flags =
;     --port=8266
;     --auth=password

; =============================================================================
; DEBUG BUILD
; =============================================================================
[env:esp8266_debug]
extends = env:esp8266
build_type = debug
build_flags =
    ${env:esp8266.build_flags}
    -D DEBUG_ESP_PORT=Serial
    -D DEBUG_ESP_CORE
    -D DEBUG_ESP_WIFI
    -D DEBUG_ESP_HTTP_CLIENT

; =============================================================================
; RECOVERY FIRMWARE — minimal, ESP8266-specific
; =============================================================================
[env:recovery]
extends = esp8266_common
build_flags =
    ${esp8266_common.build_flags}
    -D RECOVERY_MODE=1
lib_deps =
    ; Minimal deps for recovery
build_src_filter = +<recovery.cpp>
